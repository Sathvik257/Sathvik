<!DOCTYPE html>
<html>
<head>
    <title>Generate Project Images</title>
</head>
<body>
    <h1>Generating Project Images...</h1>
    <div id="output"></div>
    
    <script>
        const projects = [
            { name: 'ai-resume-maker', title: 'AI Resume Maker', color: '#667eea' },
            { name: 'battleship-game', title: 'Battleship Game', color: '#764ba2' },
            { name: 'smart-home-automation', title: 'Smart Home Automation', color: '#f093fb' },
            { name: 'movie-ticket-booking', title: 'Movie Ticket Booking', color: '#4facfe' }
        ];

        function generateImage(project) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');

            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, 400, 200);
            gradient.addColorStop(0, project.color);
            gradient.addColorStop(1, '#ffffff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 400, 200);

            // Add text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(project.title, 200, 100);

            // Add subtitle
            ctx.font = '16px Arial';
            ctx.fillText('Project Preview', 200, 130);

            // Convert to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${project.name}.jpg`;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.8);
        }

        // Generate all images
        projects.forEach(project => {
            setTimeout(() => generateImage(project), 500);
        });

        document.getElementById('output').innerHTML = '<p>Images generated! Check your downloads folder.</p>';
    </script>
</body>
</html>
